<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
 background:radial-gradient(circle at 15% 20%,#0f6b55 0%,#0a3d33 45%,#06231e 100%);color:#fff;position:relative}
.shot{position:absolute;right:-90px;top:90px;width:720px;height:420px;border-radius:18px;overflow:hidden;
 transform:perspective(1400px) rotateY(-14deg) rotateX(4deg);box-shadow:0 30px 80px rgba(0,0,0,.6);border:4px solid #2fd3a4}
.shot img{width:100%;height:100%;object-fit:cover;object-position:0 0}
.badge{position:absolute;right:70px;bottom:70px;background:#ffd23f;color:#111;font-weight:900;font-size:44px;
 padding:14px 26px;border-radius:14px;transform:rotate(-4deg);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.badge small{display:block;font-size:20px;font-weight:700;letter-spacing:.5px}
.left{position:absolute;left:56px;top:52px;width:580px}
.brand{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);
 padding:10px 20px;border-radius:999px;font-size:26px;font-weight:800;letter-spacing:.3px}
.brand .dot{width:18px;height:18px;border-radius:50%;background:#2fd3a4;box-shadow:0 0 14px #2fd3a4}
h1{margin-top:34px;font-size:84px;line-height:1;font-weight:900;letter-spacing:-2px;text-shadow:0 6px 24px rgba(0,0,0,.45)}
h1 .hl{color:#2fd3a4}
h1 .y{color:#ffd23f}
.sub{margin-top:28px;font-size:34px;font-weight:700;line-height:1.2;color:#e3f7f0}
.sub b{color:#ffd23f}
.chips{position:absolute;left:56px;bottom:52px;display:flex;gap:14px}
.chip{background:#fff;color:#0a3d33;font-weight:800;font-size:24px;padding:10px 18px;border-radius:10px}
</style></head>
<body>
<div class="shot"><img src="shot180.png"></div>
<div class="left">
  <div class="brand"><span class="dot"></span>OpsAPI · AI tax filing</div>
  <h1>AI that <span class="hl">learns</span><br>from <span class="y">last year</span></h1>
  <div class="sub">100-property landlord tax return<br><b>No accountant needed</b></div>
</div>
<div class="chips"><div class="chip">Self Assessment</div><div class="chip">HMRC MTD</div><div class="chip">2025-26</div></div>
<div class="badge"><small>ESTIMATED TAX</small>£571,272</div>
</body></html>

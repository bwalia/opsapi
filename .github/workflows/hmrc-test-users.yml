name: HMRC test-user generator

# sidecars/hmrc-test-users: tests on every PR; on main, build + push the image
# (bwalia/opsapi-hmrc-test-users:latest and :<sha>) and restart the int pod so it
# pulls it. The pod itself is created by the opsapi chart
# (devops/helm-charts/diytaxreturn-lapis/templates/hmrc-test-users.yaml).
on:
  pull_request:
    paths: ["sidecars/hmrc-test-users/**", ".github/workflows/hmrc-test-users.yml"]
  push:
    branches: [main]
    paths: ["sidecars/hmrc-test-users/**", ".github/workflows/hmrc-test-users.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmrc-test-users-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecars/hmrc-test-users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-dev.txt
      - run: python -m pytest -q tests

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWD }}
      - uses: docker/build-push-action@v5
        with:
          context: sidecars/hmrc-test-users
          push: true
          tags: |
            bwalia/opsapi-hmrc-test-users:latest
            bwalia/opsapi-hmrc-test-users:${{ github.sha }}

      - name: Say which tag to pin
        run: |
          # The chart runs the tag pinned in values-workstation-int.yaml (hmrcTestUsers.image.tag),
          # so a deploy is reproducible and helm never swaps the image underneath us. To ship
          # this build, set that tag to the line below in a PR.
          echo "::notice::Built bwalia/opsapi-hmrc-test-users:${{ github.sha }} — pin it in values-workstation-int.yaml (hmrcTestUsers.image.tag) to deploy it."

name: TypeScript SDK release

# Publishes sdk/typescript to npm as @opsapi/client when a tag like
# sdk-v0.2.0 is pushed. The tag must match package.json's version.
# Needs the NPM_TOKEN secret (an npm automation token with publish rights on @opsapi).
on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "sdk-v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected sdk-v$version)"
            exit 1
          fi
      # prepublishOnly runs typecheck, tests and build.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

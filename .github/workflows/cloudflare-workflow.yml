name: cloudflare workflow

# Upsert one Cloudflare DNS record by hand (idempotent: devops/scripts/cloudflare-dns.sh).
# It used to run an Ansible playbook over SSH with a vault-encrypted key file that is no
# longer in the repo, so every run failed at "Decrypt Ansible Vault file".
on:
  workflow_dispatch:
    inputs:
      CLOUDFLARE_RECORD_NAME:
        description: "Full record name, e.g. joyai.fictionally.org (or just the label, e.g. joyai)"
        required: true
        type: string
      CLOUDFLARE_RECORD_TYPE:
        description: "Record type"
        required: false
        default: "CNAME"
        type: string
      CLOUDFLARE_RECORD_VALUE:
        description: "Record content, e.g. lon1.pop0.uk"
        required: true
        type: string
      CLOUDFLARE_ZONE:
        description: "Zone apex, e.g. fictionally.org"
        required: true
        type: string
      CLOUDFLARE_PROXIED:
        description: "Proxy through Cloudflare (orange cloud)"
        required: false
        default: false
        type: boolean
      USE_ACCOUNT_KEY:
        description: "Use the account Global API Key instead of the scoped token (zones the token can't edit)"
        required: false
        default: false
        type: boolean

jobs:
  cloudflare-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upsert the record
        env:
          CLOUDFLARE_ZONE: ${{ inputs.CLOUDFLARE_ZONE }}
          CLOUDFLARE_API_TOKEN: ${{ !inputs.USE_ACCOUNT_KEY && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_EMAIL: ${{ inputs.USE_ACCOUNT_KEY && secrets.CLOUDFLARE_ACCOUNT_EMAIL || '' }}
          CLOUDFLARE_ACCOUNT_API_KEY: ${{ inputs.USE_ACCOUNT_KEY && secrets.CLOUDFLARE_ACCOUNT_API_KEY || '' }}
          NAME: ${{ inputs.CLOUDFLARE_RECORD_NAME }}
        run: |
          set -euo pipefail
          case "$NAME" in *.*) ;; *) NAME="$NAME.$CLOUDFLARE_ZONE" ;; esac
          chmod +x devops/scripts/cloudflare-dns.sh
          ./devops/scripts/cloudflare-dns.sh --name "$NAME" --content "${{ inputs.CLOUDFLARE_RECORD_VALUE }}" \
            --type "${{ inputs.CLOUDFLARE_RECORD_TYPE }}" --proxied "${{ inputs.CLOUDFLARE_PROXIED }}"

name: Daily PostgreSQL Backup

# Backs up the opsapi Postgres database to MinIO.
#
# The database is managed by the Zalando postgres-operator (cluster `diy-tax-db`)
# and lives INSIDE the k3s cluster on ClusterIP-only services — unreachable from
# GitHub-hosted runners. This runs on the self-hosted `acc` runner, which can
# reach the kube-apiserver (kubectl works) but is NOT on the cluster pod/service
# network, so the ClusterIP is not directly routable from it. The dump therefore
# goes through a `kubectl port-forward` tunnel (see the Dump step). Credentials
# come from the operator's own secret
# (`postgres.diy-tax-db.credentials.postgresql.acid.zalan.do`, keys
# username/password) — named consistently in every namespace that has the DB.
#
# Scheduled runs back up both `acc` and `prod` (INCLUDE_PROD below). Both are
# namespaces in the same k3s cluster, each with its own `diy-tax-db` Zalando
# cluster and the same credentials-secret name, so a single kubeconfig
# (KUBE_CONFIG_DATA_K3S) reaches both. Either env can also be run on demand via
# "Run workflow".

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        type: choice
        description: "Environment to back up"
        default: "acc"
        required: true
        options:
          - acc
          - prod
      PGDATABASE:
        type: string
        description: "Database name to dump"
        default: "opsapi"
        required: false

env:
  # prod has a `diy-tax-db` Postgres (holds the `opsapi` DB), so prod is in the
  # daily schedule. Set to "false" to drop prod from scheduled runs.
  INCLUDE_PROD: "true"
  ZALANDO_SECRET: "postgres.diy-tax-db.credentials.postgresql.acid.zalan.do"
  PG_SERVICE: "diy-tax-db"

jobs:
  # Build the matrix: the chosen env on manual runs, acc+prod on the schedule.
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.m.outputs.envs }}
    steps:
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: back up exactly the chosen environment.
            echo "envs=[\"${{ github.event.inputs.TARGET_ENV }}\"]" >> "$GITHUB_OUTPUT"
          elif [ "$INCLUDE_PROD" = "true" ]; then
            echo 'envs=["acc","prod"]' >> "$GITHUB_OUTPUT"
          else
            echo 'envs=["acc"]' >> "$GITHUB_OUTPUT"
          fi

  backup:
    needs: set-matrix
    # In-cluster runner: reaches the ClusterIP-only Postgres services.
    runs-on: [self-hosted, acc]
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.set-matrix.outputs.envs) }}
    env:
      TARGET_ENV: ${{ matrix.env }}
      PGDATABASE: ${{ github.event.inputs.PGDATABASE || 'opsapi' }}
    steps:
      - name: Install kubectl (if missing)
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          fi
          kubectl version --client=true 2>/dev/null | head -1 || true

      - name: Configure kubectl
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
        run: |
          if [ -z "$KUBECONFIG_BASE64" ]; then
            echo "::error::KUBE_CONFIG_DATA_K3S secret is not set."
            exit 1
          fi
          echo "$KUBECONFIG_BASE64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Resolve master pod (Zalando operator)
        run: |
          set -euo pipefail
          NS="$TARGET_ENV"

          if ! kubectl cluster-info --request-timeout=10s >/dev/null 2>&1; then
            echo "::error::Cannot connect to the Kubernetes cluster (check KUBE_CONFIG_DATA_K3S)."
            exit 1
          fi

          # The operator's master Service is selector-less (its Endpoints are
          # managed by the operator), so it can't be port-forwarded, and the
          # ClusterIP isn't routable from this off-cluster runner. So the dump
          # runs INSIDE the master pod (below) — found via the Zalando spilo
          # labels, which follow failover. Its pg_dump matches the server
          # version, so no pg client is needed on the runner.
          POD="$(kubectl -n "$NS" get pod \
            -l "application=spilo,cluster-name=$PG_SERVICE,spilo-role=master" \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -z "$POD" ]; then
            echo "::error::No master pod for '$PG_SERVICE' in namespace '$NS' — no Postgres deployed there?"
            exit 1
          fi

          if ! kubectl -n "$NS" get secret "$ZALANDO_SECRET" >/dev/null 2>&1; then
            echo "::error::Credentials secret '$ZALANDO_SECRET' not found in namespace '$NS'."
            exit 1
          fi
          PGUSER="$(kubectl -n "$NS" get secret "$ZALANDO_SECRET" -o jsonpath='{.data.username}' | base64 -d)"

          {
            echo "DB_POD=$POD"
            echo "PGUSER=$PGUSER"
          } >> "$GITHUB_ENV"
          echo "Master pod for $NS: $POD (db: $PGDATABASE, user: $PGUSER)"

      - name: Dump database
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%d_%H-%M-%S')"
          BACKUP_FILE="opsapi_${TARGET_ENV}_${TS}.dump"

          # Dump inside the master pod (server-version pg_dump), custom format
          # (-Fc: compressed, restorable with pg_restore), streamed to the runner
          # over the exec channel. Retry transient kubelet 502s (flaky on this
          # cluster); a real pg_dump error is printed and fails the step.
          ok=""
          for attempt in 1 2 3 4 5; do
            if kubectl -n "$TARGET_ENV" exec "$DB_POD" -c postgres -- \
                 pg_dump -U "$PGUSER" -d "$PGDATABASE" -Fc > "$BACKUP_FILE" 2>/tmp/dumperr.log; then
              ok=1; break
            fi
            if grep -q '502 Bad Gateway' /tmp/dumperr.log; then
              echo "exec attempt $attempt hit a transient 502, retrying..."; sleep 5; continue
            fi
            break
          done
          if [ -z "$ok" ]; then echo "::error::pg_dump failed"; cat /tmp/dumperr.log; exit 1; fi

          # Custom-format dumps start with the "PGDMP" magic; guard against a
          # truncated/empty file being uploaded as a "backup".
          if [ "$(head -c 5 "$BACKUP_FILE")" != "PGDMP" ] || [ "$(wc -c < "$BACKUP_FILE")" -lt 1024 ]; then
            echo "::error::Dump looks invalid/empty ($(wc -c < "$BACKUP_FILE") bytes)."; exit 1
          fi
          ls -lh "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      - name: Install MinIO client (if missing)
        run: |
          if ! command -v mc >/dev/null 2>&1; then
            curl -fsSL -O https://dl.min.io/client/mc/release/linux-amd64/mc
            chmod +x mc && sudo mv mc /usr/local/bin/
          fi

      - name: Upload backup to in-cluster MinIO
        env:
          BUCKET: db-backups
        run: |
          set -euo pipefail
          NS="$TARGET_ENV"

          # Upload to the namespace's OWN in-cluster MinIO (acc -> acc's MinIO,
          # prod -> prod's), over a port-forward tunnel. The S3 API is plain HTTP
          # on :9000 inside the cluster, so there's no external endpoint and no TLS
          # cert to mismatch. Root creds are read from the MinIO pod's own env, so
          # this works whether they're set inline or from a k8s secret.
          MPOD="$(kubectl -n "$NS" get pod -l app=diytaxreturn-minio \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -z "$MPOD" ]; then
            echo "::error::No diytaxreturn-minio pod in namespace '$NS'."; exit 1
          fi

          # Read both creds in one exec; retry transient kubelet 502s.
          creds=""
          for attempt in 1 2 3 4 5; do
            if creds="$(kubectl -n "$NS" exec "$MPOD" -- \
                 sh -c 'printf "%s\n%s\n" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"' 2>/tmp/mcreds.err)"; then
              break
            fi
            if grep -q '502 Bad Gateway' /tmp/mcreds.err; then
              echo "creds exec attempt $attempt hit a transient 502, retrying..."; sleep 5; creds=""; continue
            fi
            cat /tmp/mcreds.err; exit 1
          done
          MC_USER="$(printf '%s\n' "$creds" | sed -n '1p')"
          MC_PASS="$(printf '%s\n' "$creds" | sed -n '2p')"
          [ -n "$MC_USER" ] && [ -n "$MC_PASS" ] || { echo "::error::Could not read MinIO creds."; exit 1; }
          echo "::add-mask::$MC_PASS"

          kubectl -n "$NS" port-forward "svc/diytaxreturn-minio" 9000:9000 >/tmp/mpf.log 2>&1 &
          MPF_PID=$!
          trap 'kill "$MPF_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null && { exec 3>&-; break; }
            sleep 1
          done

          mc alias set backup "http://127.0.0.1:9000" "$MC_USER" "$MC_PASS"
          mc mb --ignore-existing "backup/$BUCKET"
          mc cp "$BACKUP_FILE" "backup/$BUCKET/postgres/${TARGET_ENV}/$BACKUP_FILE"
          echo "Uploaded to $BUCKET/postgres/${TARGET_ENV}/$BACKUP_FILE (in-cluster $NS MinIO)"

      - name: Cleanup
        if: always()
        run: rm -f "$BACKUP_FILE" || true

      # Report this env's backup result to Beacon / SysOps 24/7, which fans it out
      # to the org's notification channels: a green tick on success, a red alert on
      # failure. Runs on always() so both outcomes are reported (and each matrix
      # leg reports its own env). Uses plain curl — no jq — so it works on this
      # self-hosted runner regardless of what's installed, and never fails the
      # backup: a notification error is logged and ignored. Set the repo secret
      # BEACON_NOTIFY_URL to the ingest URL from the repo's GitHub Actions monitor
      # in Beacon (enable "notify on success" on that monitor for the green tick).
      - name: Notify Beacon (backup result)
        if: always()
        env:
          BEACON_URL: ${{ secrets.BEACON_NOTIFY_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          if [ -z "${BEACON_URL:-}" ]; then
            echo "BEACON_NOTIFY_URL not set — skipping Beacon notification."
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Every value below is controlled, so a printf'd JSON body is safe.
          payload=$(printf '{"status":"%s","repository":"%s","workflow":"PostgreSQL Backup — %s","run_id":"%s","run_number":"%s","branch":"%s","actor":"%s","event":"%s","run_url":"%s"}' \
            "$JOB_STATUS" "$GITHUB_REPOSITORY" "$TARGET_ENV" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" \
            "${GITHUB_REF_NAME:-}" "${GITHUB_ACTOR:-}" "${GITHUB_EVENT_NAME:-}" "$RUN_URL")
          if curl -sS -m 15 -X POST "$BEACON_URL" -H 'Content-Type: application/json' -d "$payload"; then
            echo "Reported '$JOB_STATUS' backup result for '$TARGET_ENV' to Beacon."
          else
            echo "Beacon notification failed (ignored)."
          fi

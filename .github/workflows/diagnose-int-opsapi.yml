name: Diagnose int opsapi

# One-shot: dump why workstation-opsapi's new pod won't become Ready on int.
# Runs on the self-hosted runner that has cluster access (same as the deploy).
on:
  push:
    branches: [diag/int-opsapi]
    paths: ['.github/workflows/diagnose-int-opsapi.yml']
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Decode kubeconfig
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBE_CONFIG_DATA_K3S }}
        run: |
          [ -n "$KUBECONFIG_BASE64" ] || { echo "::error::KUBE_CONFIG_DATA_K3S empty"; exit 1; }
          echo "$KUBECONFIG_BASE64" | base64 -d > kubeconfig
          chmod 600 kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> "$GITHUB_ENV"
      - name: debworker00 focus (opsapi is nodeSelector-pinned here)
        run: |
          set +e
          echo "=== debworker00 pod capacity ==="
          kubectl get node debworker00 -o jsonpath='{"capacity.pods="}{.status.capacity.pods}{"  allocatable.pods="}{.status.allocatable.pods}{"\n"}'
          echo "=== pod counts on debworker00 by phase ==="
          kubectl get pods -A --field-selector spec.nodeName=debworker00 --no-headers 2>/dev/null | awk '{print $4}' | sort | uniq -c
          echo "  TOTAL on debworker00: $(kubectl get pods -A --field-selector spec.nodeName=debworker00 --no-headers 2>/dev/null | wc -l)"
          echo "=== terminal/dead pods on debworker00 (reclaimable) ==="
          kubectl get pods -A --field-selector spec.nodeName=debworker00 --no-headers 2>/dev/null | awk '$4!="Running" && $4!="Pending"{print $1"/"$2" ("$4")"}' | head -30

      - name: Current schedule reason + resources
        run: |
          set +e
          echo "=================== opsapi pod: CURRENT scheduling reason ==================="
          POD=$(kubectl -n int get pods -l app=workstation-opsapi -o name | tail -1)
          echo "pod=$POD  status=$(kubectl -n int get $POD -o jsonpath='{.status.phase}')"
          kubectl -n int describe $POD 2>&1 | sed -n '/Events:/,$p' | tail -8
          echo "--- pod resource REQUESTS ---"
          kubectl -n int get $POD -o jsonpath='{range .spec.containers[*]}{.name}{": "}{.resources}{"\n"}{end}'
          echo "--- node allocatable cpu/mem + top talkers ---"
          kubectl get nodes -o custom-columns='NODE:.metadata.name,CPU:.status.allocatable.cpu,MEM:.status.allocatable.memory' 2>&1 | head -20

      - name: Node capacity
        run: |
          set +e
          echo "=================== NODES: pod capacity vs used ==================="
          kubectl get nodes -o custom-columns='NODE:.metadata.name,SCHEDULABLE:.spec.unschedulable,PODS_CAPACITY:.status.capacity.pods,PODS_ALLOCATABLE:.status.allocatable.pods'
          echo "--- running pods per node (count) ---"
          kubectl get pods -A --field-selector=status.phase=Running -o wide --no-headers | awk '{print $8}' | sort | uniq -c | sort -rn
          echo "--- node taints ---"
          kubectl get nodes -o custom-columns='NODE:.metadata.name,TAINTS:.spec.taints[*].key'
          echo "=================== opsapi pod placement rules ==================="
          echo "--- nodeSelector ---"; kubectl -n int get deploy workstation-opsapi -o jsonpath='{.spec.template.spec.nodeSelector}{"\n"}'
          echo "--- affinity ---";     kubectl -n int get deploy workstation-opsapi -o jsonpath='{.spec.template.spec.affinity}{"\n"}'
          echo "--- tolerations ---";  kubectl -n int get deploy workstation-opsapi -o jsonpath='{.spec.template.spec.tolerations}{"\n"}'

      - name: Diagnose
        run: |
          set +e
          NS=int; REL=workstation-opsapi
          echo "=================== PODS ==================="
          kubectl -n $NS get pods -l app=$REL -o wide
          echo "=================== DEPLOY / RS ============"
          kubectl -n $NS get deploy $REL -o wide
          kubectl -n $NS get rs -l app=$REL -o wide
          POD=$(kubectl -n $NS get pods -l app=$REL --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
          echo "=================== DESCRIBE $POD ==========="
          kubectl -n $NS describe pod "$POD" 2>&1 | tail -50
          echo "=================== LOGS (current) ========="
          kubectl -n $NS logs "$POD" --all-containers --tail=150 2>&1
          echo "=================== LOGS (previous) ========"
          kubectl -n $NS logs "$POD" --all-containers --previous --tail=150 2>&1
          echo "=================== EVENTS ================="
          kubectl -n $NS get events --sort-by=.lastTimestamp 2>&1 | tail -30
          echo "=================== END ===================="

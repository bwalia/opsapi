name: tmp deploy ollama diytax auth rule
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Login to lon1 and activate ollama.diytaxreturn.co.uk auth rule
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GATEWAY: https://lon1.pop0.uk
          EMAIL: debian@wslproxy.org
        run: |
          set -euo pipefail
          RESP=$(curl -sS -X POST "${GATEWAY%/}/api/user/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\": \"$EMAIL\", \"password\": \"$ADMIN_PASSWORD\"}")
          TOKEN=$(echo "$RESP" | jq -r '.data.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "LOGIN FAILED: $(echo "$RESP" | jq -c '.')"
            exit 1
          fi
          echo "LOGIN OK"
          echo "::add-mask::$TOKEN"

          RULE_JSON='{"id":"90775fe0-2ba3-435d-9710-08844ffb1d00","name":"ollama-diytaxreturn-jwt-auth","profile_id":"prod","priority":1,"version":1,"_schema_version":2,"rules_tags":{},"servers":["host:ollama.diytaxreturn.co.uk"],"match":{"rules":{"path":"/","path_key":"starts_with","jwt_token_validation":"header_jwt_token_validation","jwt_token_validation_value":"x-api-key","jwt_token_validation_key":"bTdROXZYMnBMOHpSNG5UNmNIMWFLNXNXMGRGM3VKOUI"},"response":{"code":305,"allow":false,"strip_path":false,"is_consul":false,"auto_redirect_https":false,"routing":{"mode":"least_conn"},"redirect_uri":"vpnhh.workstation.co.uk:8888","backends":[{"address":"vpnhh.workstation.co.uk:8888","weight":100,"label":"vpnhh.workstation.co.uk:8888-origin"}]}}}'
          SERVER_JSON='{"custom_location_block":{},"rate_limit":{"requests_per_second":100,"burst":50},"proxy_pass":"http://localhost","config":"","config_status":false,"ssl_auto_renew":true,"created_at":1782717390,"rate_limit_enabled":false,"custom_headers":{},"listens":[{"listen":"80"}],"custom_response_headers":{},"server_name":"ollama.diytaxreturn.co.uk","cached_mime_types":{},"pop_ids":{},"cache_bypass_auth":false,"rules":"90775fe0-2ba3-435d-9710-08844ffb1d00","ssl_enabled":true,"access_log":"logs/access.log","custom_http_block":{},"custom_block":{},"varnish_config":{"backend_between_bytes_timeout":10,"cache_ttl_default":120,"listen_address":"0.0.0.0","listen_port":"6081","cache_size":"256m","cache_keep":7200,"admin_listen_port":"6082","cache_grace":3600,"backend_connect_timeout":5,"health_check_enabled":false,"health_check_url":"/health","backend_first_byte_timeout":60,"health_check_interval":5,"health_check_timeout":2},"ssl_email":"balinder.walia@gmail.com","servers_tags":{},"ssl_force_https":true,"ssl_staging":false,"cache_enabled":false,"varnish_snippets":{},"cache_ttl":3600,"profile_id":"prod","locations":{},"index":"index.html","match_cases":{},"waf_enabled":false,"root":"/var/www/html","dns_record_type":"A","error_log":"logs/error.log","id":"host:ollama.diytaxreturn.co.uk","varnish_enabled":false}'

          RULES_BODY=$(printf '%s' "$RULE_JSON" | jq -c '{data: [.], dataType: "rules"}')
          HTTP=$(curl -sS -o /tmp/import.json -w '%{http_code}' \
            -X POST "${GATEWAY%/}/api/projects/import?_format=json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-platform: react-admin" \
            -H "Content-Type: application/json" \
            --data-binary "$RULES_BODY")
          echo "import rule http=$HTTP"
          jq -c '.' /tmp/import.json || cat /tmp/import.json
          case "$HTTP" in 200|201|204) ;; *) exit 1 ;; esac

          SERVER_PAYLOAD=$(printf '%s' "$SERVER_JSON" | jq -c '
            .config_status = true
            | if (.config|type)=="string" and (.config|length)>0 then
                try (.config = (.config | @base64d)) catch .
              else . end
          ')
          SID=$(printf '%s' "$SERVER_JSON" | jq -r .id)
          HTTP=$(curl -sS -o /tmp/put.json -w '%{http_code}' \
            -X PUT "${GATEWAY%/}/api/servers/${SID}?_format=json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-platform: react-admin" \
            -H "Content-Type: application/json" \
            --data-binary "$SERVER_PAYLOAD")
          echo "PUT server http=$HTTP"
          jq -c '{id, server_name, rules, config_status}' /tmp/put.json 2>/dev/null || head -c 500 /tmp/put.json
          case "$HTTP" in 200|201) ;; *) exit 1 ;; esac
          echo "Deployed auth rule for ollama.diytaxreturn.co.uk"

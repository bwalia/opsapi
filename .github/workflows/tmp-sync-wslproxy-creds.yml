name: tmp sync wslproxy creds to diy-tax
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch diy-tax register with working password
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RING_PROMOTER_TOKEN: ${{ secrets.RING_PROMOTER_TOKEN }}
          GATEWAY: https://lon1.pop0.uk
          EMAIL: debian@wslproxy.org
        run: |
          set -euo pipefail
          RESP=$(curl -sS -X POST "${GATEWAY%/}/api/user/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\": \"$EMAIL\", \"password\": \"$ADMIN_PASSWORD\"}")
          TOKEN=$(echo "$RESP" | jq -r '.data.accessToken // empty')
          [ -n "$TOKEN" ] || { echo "LOGIN FAILED"; echo "$RESP"; exit 1; }
          echo "LOGIN OK — dispatching diy-tax register-domains"
          echo "::add-mask::$TOKEN"

          # Prefer RING_PROMOTER_TOKEN; fall back would fail cross-repo
          GH="${RING_PROMOTER_TOKEN}"
          HTTP=$(curl -sS -o /tmp/disp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/bwalia/diy-tax-return-uk/actions/workflows/wslproxy-register-domains.yml/dispatches" \
            -d "$(jq -n \
              --arg ref "main" \
              --arg env "prod" \
              --arg pass "$ADMIN_PASSWORD" \
              '{ref:$ref, inputs:{TARGET_ENV:$env, ACTIVATE_CONFIG:"true", ADMIN_PASSWORD:$pass, SERVER_NAMES:"=ollama.diytaxreturn.co.uk"}}')")
          echo "dispatch http=$HTTP"
          cat /tmp/disp.json || true
          [ "$HTTP" = "204" ] || exit 3
          echo "Dispatched Register WSL Proxy Domains for ollama.diytaxreturn.co.uk"

# version: '3.9'

services:

  gatus:
      image: twinproduction/gatus:latest
      container_name: opsapi-gatus
      restart: unless-stopped
      ports:
        - "8877:8080"
      depends_on:
      - minio
      - adminer
      - lapis
      volumes:
        - ./gatus/config:/config
      networks:
        opsapi-network:
          ipv4_address: 172.71.0.18

  lapis:
    container_name: opsapi
    build: .
    # Host port moved off 4010 (taken by the separate diy-tax-return-uk stack's
    # tax_return_opsapi container) so both opsapi stacks coexist. Container port
    # stays 80. API/Swagger on the host are now at http://127.0.0.1:4020.
    ports:
      - "4020:80"
    volumes:
      - .:/app
      - ../projects:/app/projects
      - ./logs:/var/log/nginx
    env_file: ".env"
    environment:
      - PROJECT_CODE=${PROJECT_CODE:-all}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:29092}
      # The opsapi-ollama container was removed — Ollama runs natively on the
      # host Mac. Reach it via host.docker.internal (mapped in extra_hosts below).
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    # DNS configuration for external API calls (GitHub, etc.)
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    # Reach the host machine's Ollama (running natively on the Mac, not the
    # opsapi-ollama container). The custom `dns:` above bypasses Docker's embedded
    # resolver, so host.docker.internal won't resolve via DNS — this writes it to
    # /etc/hosts instead, which takes precedence regardless of DNS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      opsapi-network:
        ipv4_address: 172.71.0.12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Next.js Dashboard
  dashboard:
    container_name: opsapi-dashboard
    build:
      context: ../opsapi-dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:4020}
    ports:
      - "8039:8039"
    environment:
      - NODE_ENV=production
    depends_on:
      - lapis
    networks:
      opsapi-network:
        ipv4_address: 172.71.0.19
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8039"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  postgres:
    container_name: opsapi-postgres-dev-db
    restart: unless-stopped
    image: pgvector/pgvector:pg14
    # Host port moved off 5439 (taken by another local Postgres container).
    # Container-internal port stays 5432, so POSTGRES_HOST=172.71.0.10:5432
    # and Adminer (which connects over the network) are unaffected — this
    # only changes host access, e.g. psql -h 127.0.0.1 -p 5440.
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: ".env"
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
      POSTGRES_DB: ${POSTGRES_DB:-opsapi}
    command: ["postgres", "-c", "max_connections=200"]
    networks:
      opsapi-network:
        ipv4_address: 172.71.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pguser}"]
      interval: 30s
      timeout: 20s
      retries: 3
  # mariadb:
  #   container_name: opsapi-dev-db
  #   image: mariadb
  #   ports:
  #     - "3319:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: msroot
  #     MYSQL_DATABASE: opsapi
  #     MYSQL_USER: msuser
  #     MYSQL_PASSWORD: mspassword
  #   networks:
  #     opsapi-network:
  #       ipv4_address: 172.71.0.11

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - 7779:8080
    networks:
      opsapi-network:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 20s
      retries: 3


  redis:
    image: redis:alpine
    container_name: opsapi-redis
    restart: unless-stopped
    ports:
      - "6373:6379"
    networks:
      opsapi-network:
        ipv4_address: 172.71.0.13
    volumes:
      - ./session-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: opsapi-minio
    restart: unless-stopped
    # Host ports moved off 9000/9001 — those are taken by another local MinIO
    # (another Docker stack). Container-internal ports stay 9000/9001, so the
    # network alias minio:9000 and MINIO_ENDPOINT (172.71.0.17:9000) are
    # unchanged; only host access moves. Console: http://127.0.0.1:9901
    ports:
      - "9900:9000"
      - "9901:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DOMAIN: test-s3.diytaxreturn.co.uk,test-s3-cli.diytaxreturn.co.uk
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      opsapi-network:
        ipv4_address: 172.71.0.17
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO initialization - creates buckets and sets public policy
  minio-init:
    image: minio/mc:latest
    container_name: opsapi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;

      echo 'Creating buckets...';
      mc mb local/opsapi --ignore-existing;
      mc mb local/opsapi-diytaxreturn --ignore-existing;
      mc mb local/documents --ignore-existing;
      mc mb local/avatars --ignore-existing;
      mc mb local/attachments --ignore-existing;
      mc mb local/media --ignore-existing;
      mc mb local/backups --ignore-existing;
      mc mb local/temp --ignore-existing;

      echo 'Setting bucket policies...';
      mc anonymous set public local/opsapi;
      mc anonymous set public local/opsapi-diytaxreturn;
      mc anonymous set public local/documents;
      mc anonymous set public local/avatars;
      mc anonymous set public local/attachments;
      mc anonymous set public local/media;

      echo 'All buckets created successfully!';
      mc ls local;
      exit 0;
      "
    networks:
      opsapi-network:


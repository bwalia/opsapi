  #     - ../node/opsapi-node:/usr/src/app
  #   env_file: "../node/opsapi-node/.env"

  # Ollama runs natively on the host Mac (reached via host.docker.internal),
  # so the in-compose ollama container was removed.

  # Kafka - Event streaming, single-node KRaft mode (no Zookeeper).
  # Zookeeper was removed; Kafka 3.x / cp-kafka 7.5.0 self-manages metadata
  # via the KRaft controller quorum, so this one container is the whole
  # cluster. CLUSTER_ID is fixed so the storage format is stable across
  # restarts (the confluent entrypoint auto-formats on first boot).
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: opsapi-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      opsapi-network:
        ipv4_address: 172.71.0.21
    healthcheck:
      # kafka-topics --list can hang under single-node KRaft; api-versions is a
      # fast, reliable "is the broker accepting connections?" probe.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 30s
      timeout: 15s
      retries: 5

  # Prometheus - Metrics collection and alerting
  prometheus:
    image: prom/prometheus:latest
    container_name: opsapi-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../devops/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../devops/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      opsapi-network:
        ipv4_address: 172.71.0.15
    depends_on:
      - lapis

  # loki:
  #     image: grafana/loki:2.8.2
  #     container_name: opsapi-loki
  #     ports:
  #       - "3100:3100"
  #     command: -config.file=/etc/loki/local-config.yaml
  #     volumes:
  #       - ./loki_data:/loki
  #       - ../devops/loki-config.yaml:/etc/loki/local-config.yaml
  #     networks:
  #       opsapi-network:
  #         ipv4_address: 172.71.0.9

  # Grafana - Metrics visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: opsapi-grafana
    restart: unless-stopped
    ports:
      - "3011:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../devops/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ../devops/grafana-dashboards-provisioning.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ../devops/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/opsapi-dashboard.json
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://127.0.0.1:3011
      - GF_INSTALL_PLUGINS=
    networks:
      opsapi-network:
        ipv4_address: 172.71.0.16
    depends_on:
      - prometheus

networks:
  opsapi-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.71.0.0/16
          gateway: 172.71.0.1

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  minio_data:
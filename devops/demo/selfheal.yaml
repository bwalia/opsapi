# Self-heal for the *.demo.opsapi.org apps. On 2026-10-31 hello-java.demo.opsapi.org returned 404:
# Helm still listed the release as deployed, but its Deployment, Service and Ingress were gone
# (deleted outside Helm; the cause wasn't recoverable). Every 10 minutes this checks that every
# resource of every deployed Helm release in `demo` still exists. If any is missing, it re-applies
# the release's current revision (helm rollback to itself recreates exactly what was deployed)
# and logs what it restored. Nothing is changed when everything is present.
# On 2026-11-19 ~08:22Z hello-java and hello-rust were scaled to 0 outside Helm (edge answered
# 503 "no available server"; the Ingress was still there, so the check above saw nothing wrong).
# So it also compares each Deployment/StatefulSet's live replicas with the release's manifest and
# scales any that are below it back up. To park one on purpose, change replicaCount in the
# release (helm upgrade), or annotate the workload `demo-selfheal/skip=true`.
# Applied by .github/workflows/deploy-opsapi-showcase.yml (weekly), or by hand:
#   kubectl apply -f devops/demo/selfheal.yaml
#   kubectl -n demo logs -l app=demo-selfheal --tail=50     # what it did
# It only heals Helm releases. The kubectl-applied pieces (databases, ExternalSecrets, the reset
# CronJob, the mock IdP) are re-applied by that weekly workflow.
apiVersion: v1
kind: ServiceAccount
metadata: { name: demo-selfheal, namespace: demo, labels: { app: demo-selfheal } }
---
# Namespace-scoped: it can only touch the demo namespace. `admin` there, because a rollback must
# read and write Helm's release Secrets and re-create any kind of resource a release owns; a
# narrower Role would still need Secrets, so it would protect nothing. The image is therefore
# pinned by digest: a re-pushed tag can't run with these rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: demo-selfheal, namespace: demo, labels: { app: demo-selfheal } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: demo-selfheal, namespace: demo }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: demo-selfheal, namespace: demo, labels: { app: demo-selfheal } }
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata: { labels: { app: demo-selfheal } }
        spec:
          serviceAccountName: demo-selfheal
          restartPolicy: Never
          nodeSelector: { net-region: home, kubernetes.io/arch: amd64 }
          containers:
            - name: selfheal
              # helm + kubectl + jq; alpine/k8s:1.31.4, pinned (see the RoleBinding note).
              image: alpine/k8s@sha256:9c4976d47656d78cf53a92b0203fc54ac45eae18a2b45001ac221c27da4c8036
              resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  healed=0; scaled=0; failed=0
                  for r in $(helm -n demo list --deployed -q); do
                    missing=$(helm -n demo get manifest "$r" | kubectl -n demo get -f - -o name 2>&1 | grep -i "not found" || true)
                    [ -z "$missing" ] && continue
                    rev=$(helm -n demo history "$r" --max 1 -o json | jq -r '.[-1].revision')
                    echo "$(date -u +%FT%TZ) $r: missing resources, re-applying revision $rev:"
                    echo "$missing" | sed 's/^/    /'
                    if helm -n demo rollback "$r" "$rev" --wait --timeout 5m; then healed=$((healed + 1))
                    else echo "$(date -u +%FT%TZ) $r: re-apply FAILED"; exit 1; fi
                  done
                  # Replica drift: a workload scaled below what its release declares (e.g. to 0).
                  # Only scales up, so it never fights a deliberate scale-out.
                  for r in $(helm -n demo list --deployed -q); do
                    helm -n demo get manifest "$r" | kubectl create --dry-run=client -o json -f - 2>/dev/null \
                      | jq -r '(.items // [.])[] | select(.kind=="Deployment" or .kind=="StatefulSet")
                               | "\(.kind | ascii_downcase)/\(.metadata.name) \(.spec.replicas // 1)"'
                  done > /tmp/want
                  while read -r obj want; do
                    live=$(kubectl -n demo get "$obj" -o json 2>/dev/null \
                      | jq -r 'if .metadata.annotations["demo-selfheal/skip"] == "true" then "skip" else (.spec.replicas // 1) end') || continue
                    case "$live" in ''|skip) continue ;; esac
                    [ "$live" -ge "$want" ] && continue
                    echo "$(date -u +%FT%TZ) $obj: replicas $live, release declares $want, scaling up"
                    if kubectl -n demo scale "$obj" --replicas="$want" \
                       && kubectl -n demo rollout status "$obj" --timeout=5m; then scaled=$((scaled + 1))
                    else echo "$(date -u +%FT%TZ) $obj: scale-up FAILED"; failed=1; fi
                  done < /tmp/want
                  echo "$(date -u +%FT%TZ) checked $(helm -n demo list --deployed -q | wc -l) releases, restored $healed, scaled up $scaled"
                  exit $failed

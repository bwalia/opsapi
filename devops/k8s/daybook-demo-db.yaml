# daybook-demo-db: Postgres for the Daybook demo back office (demo.daybook.co.uk).
#
# Owned by ONE release (`daybook-demo`, k8s namespace `daybook-demo`, cluster k3s1),
# PROJECT_CODE=tax_copilot. Copied from opsapi-showcase-db.yaml (pgvector image, so
# the tax-classifier migration's vector(384) type works on a fresh volume).
#
# Credentials: POSTGRES_PASSWORD comes from WSL Vault daybook-demo/config
# (devops/daybook-demo/seed-vault-daybook.sh). No plaintext in git.
#
# Apply (one-time; the PVC persists across app redeploys; the deploy workflow
# re-applies it, which is a no-op):
#   kubectl apply -f devops/k8s/daybook-demo-db.yaml
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: daybook-demo-db-auth
  namespace: daybook-demo
  labels:
    app: daybook-demo-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: wslvault-backend
    kind: ClusterSecretStore
  target:
    name: daybook-demo-db-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: daybook-demo/config
        property: POSTGRES_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daybook-demo-db-initdb
  namespace: daybook-demo
  labels:
    app: daybook-demo-db
data:
  # Runs ONLY on a fresh (empty) data volume, against POSTGRES_DB.
  01-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: v1
kind: Service
metadata:
  name: daybook-demo-db
  namespace: daybook-demo
  labels:
    app: daybook-demo-db
spec:
  type: ClusterIP
  selector:
    app: daybook-demo-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: daybook-demo-db
  namespace: daybook-demo
  labels:
    app: daybook-demo-db
spec:
  serviceName: daybook-demo-db
  replicas: 1
  selector:
    matchLabels:
      app: daybook-demo-db
  template:
    metadata:
      labels:
        app: daybook-demo-db
    spec:
      # LAN amd64 pool, same as the app (see values-daybook-demo.yaml). local-path
      # binds the PVC to whichever node first schedules it, so the pod stays there.
      nodeSelector:
        net-region: home
        kubernetes.io/arch: amd64
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: pguser
            - name: POSTGRES_DB
              value: daybook_demo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daybook-demo-db-auth
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U pguser -d daybook_demo -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U pguser -d daybook_demo -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: daybook-demo-db-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi

# Self-heal for the Daybook demo (namespace daybook-demo): a copy of
# devops/demo/selfheal.yaml (see the history there). Every 10 minutes it re-applies any
# Helm release in daybook-demo whose resources went missing, and scales back up any
# workload below its declared replicas. Applied by deploy-daybook-demo.yml.
#   kubectl -n daybook-demo logs -l app=daybook-demo-selfheal --tail=50
apiVersion: v1
kind: ServiceAccount
metadata: { name: daybook-demo-selfheal, namespace: daybook-demo, labels: { app: daybook-demo-selfheal } }
---
# Namespace-scoped: it can only touch the demo namespace. `admin` there, because a rollback must
# read and write Helm's release Secrets and re-create any kind of resource a release owns; a
# narrower Role would still need Secrets, so it would protect nothing. The image is therefore
# pinned by digest: a re-pushed tag can't run with these rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: daybook-demo-selfheal, namespace: daybook-demo, labels: { app: daybook-demo-selfheal } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects: [{ kind: ServiceAccount, name: daybook-demo-selfheal, namespace: daybook-demo }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: daybook-demo-selfheal, namespace: daybook-demo, labels: { app: daybook-demo-selfheal } }
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata: { labels: { app: daybook-demo-selfheal } }
        spec:
          serviceAccountName: daybook-demo-selfheal
          restartPolicy: Never
          nodeSelector: { net-region: home, kubernetes.io/arch: amd64 }
          containers:
            - name: selfheal
              # helm + kubectl + jq; alpine/k8s:1.31.4, pinned (see the RoleBinding note).
              image: alpine/k8s@sha256:9c4976d47656d78cf53a92b0203fc54ac45eae18a2b45001ac221c27da4c8036
              resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  healed=0; scaled=0; failed=0
                  for r in $(helm -n daybook-demo list --deployed -q); do
                    missing=$(helm -n daybook-demo get manifest "$r" | kubectl -n daybook-demo get -f - -o name 2>&1 | grep -i "not found" || true)
                    [ -z "$missing" ] && continue
                    rev=$(helm -n daybook-demo history "$r" --max 1 -o json | jq -r '.[-1].revision')
                    echo "$(date -u +%FT%TZ) $r: missing resources, re-applying revision $rev:"
                    echo "$missing" | sed 's/^/    /'
                    if helm -n daybook-demo rollback "$r" "$rev" --wait --timeout 5m; then healed=$((healed + 1))
                    else echo "$(date -u +%FT%TZ) $r: re-apply FAILED"; exit 1; fi
                  done
                  # Replica drift: a workload scaled below what its release declares (e.g. to 0).
                  # Only scales up, so it never fights a deliberate scale-out.
                  for r in $(helm -n daybook-demo list --deployed -q); do
                    helm -n daybook-demo get manifest "$r" | kubectl create --dry-run=client -o json -f - 2>/dev/null \
                      | jq -r '(.items // [.])[] | select(.kind=="Deployment" or .kind=="StatefulSet")
                               | "\(.kind | ascii_downcase)/\(.metadata.name) \(.spec.replicas // 1)"'
                  done > /tmp/want
                  while read -r obj want; do
                    live=$(kubectl -n daybook-demo get "$obj" -o json 2>/dev/null \
                      | jq -r 'if .metadata.annotations["demo-selfheal/skip"] == "true" then "skip" else (.spec.replicas // 1) end') || continue
                    case "$live" in ''|skip) continue ;; esac
                    [ "$live" -ge "$want" ] && continue
                    echo "$(date -u +%FT%TZ) $obj: replicas $live, release declares $want, scaling up"
                    if kubectl -n daybook-demo scale "$obj" --replicas="$want" \
                       && kubectl -n daybook-demo rollout status "$obj" --timeout=5m; then scaled=$((scaled + 1))
                    else echo "$(date -u +%FT%TZ) $obj: scale-up FAILED"; failed=1; fi
                  done < /tmp/want
                  echo "$(date -u +%FT%TZ) checked $(helm -n daybook-demo list --deployed -q | wc -l) releases, restored $healed, scaled up $scaled"
                  exit $failed

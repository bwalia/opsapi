# ── OpsAPI Dashboard on workstation.co.uk — INTEGRATION ─────────────────────
# Helm RELEASE: workstation-opsapi-dashboard   Namespace: int   Cluster: k3s1
# Public host: https://int-opsapi-ui.workstation.co.uk
#   → calls the API at https://int-opsapi.workstation.co.uk (workstation-opsapi)
#
# Layered on top of values.yaml by deploy-workstation-dashboard.yml. Only the
# fields that differ from the base defaults (or that other jobs read) live here.
env: int

# The API this UI calls. Baked into the browser bundle at BUILD time
# (--build-arg NEXT_PUBLIC_API_URL) by the deploy workflow.
apiUrl: https://int-opsapi.workstation.co.uk

# Single source of truth for the DNS + wslproxy jobs (read via awk). MUST equal
# ingress.hostname below.
host: int-opsapi-ui.workstation.co.uk

# traefik-edge, not wslproxy: the wslproxy ingress class is a black hole while
# its controller cannot authenticate to its own OpenResty admin API — see the
# note in diytaxreturn-lapis/values-workstation-int.yaml.
ingress:
  enabled: true
  className: traefik-edge
  hostname: int-opsapi-ui.workstation.co.uk
  annotations: {}
  tls: []

# Pin to debian006 — a LAN (home) amd64 node with pod/disk headroom. Explicitly
# a home node, NOT a cloud edge node. The old pin was debworker00, which hit its
# 110-pod cap and stranded the rollout Pending (helm --wait timed out).
# NOTE: this is a single-host pin. If debian006 goes NotReady the dashboard won't
# reschedule until it's back — repoint this hostname to another home node then.
nodeSelector:
  kubernetes.io/hostname: debian006

# debian006 has almost all its CPU reserved (2026-11-05: 3990m of 4000m), so
# a rolling update can't start the new pod next to the old one and helm --wait
# times out with the new pod Pending. Stop the old pod first instead: int's
# dashboard is down for the ~30 s the new one takes to start.
rollingUpdate:
  maxUnavailable: 1
  maxSurge: 0

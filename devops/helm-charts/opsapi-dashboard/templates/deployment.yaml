apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Default: start the new pod before stopping the old one (no downtime).
      # A ring pinned to one nearly-full host sets maxSurge 0 / maxUnavailable 1
      # (values-workstation-int.yaml): there is no room for a second pod there.
      # No `default` here: it treats 0 as empty. values.yaml holds the defaults.
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Bump on every helm upgrade so the :latest image is re-pulled even when
        # the tag is unchanged (the deploy workflow sets this to build time).
        deployed-at: {{ .Values.deployedAt | default "unset" | quote }}
    spec:
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_DEPLOY_ENV
              value: {{ .Values.env | quote }}
            # Server-side reads only. The browser bundle uses the value baked in
            # at BUILD time (--build-arg NEXT_PUBLIC_API_URL). See README.
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.apiUrl | quote }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

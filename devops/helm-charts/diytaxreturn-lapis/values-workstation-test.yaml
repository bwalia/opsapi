# ── OpsAPI on workstation.co.uk — TEST ─────────────────────────────────────
# Helm RELEASE: workstation-opsapi   Namespace: test   Cluster: k3s1
# Public host: https://test-opsapi.workstation.co.uk
#
# Dedicated `workstation-opsapi` release (see values-workstation-int.yaml for
# the full story). Separate from the legacy diytaxreturn-lapis release.
env: test
app: workstation-opsapi

# Single source of truth for the DNS + wslproxy jobs. MUST equal
# ingress.hosts[0].host below.
host: test-opsapi.workstation.co.uk

projectCode: all

# Password-reset / invite links → the workstation admin UI for this ring.
frontendUrl: "https://test-opsapi-ui.workstation.co.uk"

image:
  repository: bwalia/opsapi
  tag: latest
  pullPolicy: Always

# Two pods: a pod restart (deploy, crash, node drain) no longer takes the API
# and chat down. Needs Redis (chat events cross pods through it); the chart
# refuses replicaCount > 1 without it. See templates/redis.yaml.
replicaCount: 2
redis:
  enabled: true

service:
  type: ClusterIP
  port: 80

# Dedicated Ingress — className `traefik-edge`, plain HTTP :80 (TLS at the edge,
# no cert-manager on k3s1). MUST match int/prod: `wslproxy` returns bare 404
# (controller cannot program its OpenResty data plane). See -int for detail.
ingress:
  enabled: true
  className: traefik-edge
  annotations: {}
  hosts:
    - host: test-opsapi.workstation.co.uk
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Same LAN amd64 pool as int — reaches the Zalando DB and avoids the
# cloud<->LAN WireGuard mesh. See values-workstation-int.yaml.
nodeSelector:
  net-region: home
  kubernetes.io/arch: amd64

# Dedicated Zalando Postgres (devops/k8s/workstation-db-test.yaml). Apply that
# manifest + run devops/vault/copy-workstation-opsapi-secrets.sh test before
# the first deploy so Vault has POSTGRES_PASSWORD matching Zalando's pguser.
database:
  name: workstation_opsapi
  host: workstation-opsapi-db.test.svc.cluster.local

# Zalando Spilo pg_hba rejects hostnossl — pgmoon must use SSL.
postgresSsl: "true"

externalSecret:
  enabled: true
  # Same WSL Vault store as int/prod (HC Vault seal blips used to strand ESO).
  secretStore: wslvault-backend
  vaultPath: workstation-opsapi/test/config

setup:
  adminEmail: ""
  adminPassword: ""
  namespaceSlug: "workstation"

# Shared int MinIO for now (separate bucket opsapi-test via Vault). Override
# here so the chart env wins even if Vault drifts.
minio:
  endpoint: http://workstation-minio.int.svc.cluster.local:9000
  externalUrl: https://int-minio.workstation.co.uk
  credsSecret: workstation-minio-creds

# Browser CORS allow-list (consumed by middleware/cors.lua) — git-owned here.
# workstation.academy lets the Academy tenant's instructor dashboard
# (test-teach.workstation.academy) call this shared API cross-origin;
# workstation.co.uk covers the opsapi admin UI. Additive; matches int.
corsAllowedDomains: "workstation.co.uk,workstation.academy,tenthmatrix.com,tenthmatrix.co.uk"

# Workstation AI Shop (shop.workstation.co.uk, workstation-website/shop).
# Plain config → SHOP_ALLOWED_ORIGINS / SHOP_PUBLIC_URL container env (see
# templates/deployment.yaml). allowedOrigins gates /checkout success/cancel URLs.
# Secrets are NOT here — add them to Vault secret/diytaxreturnuk/opsapi/test/config
# (both optional; shop payments stay disabled until set):
#   STRIPE_SHOP_WEBHOOK_SECRET  whsec_… for https://test-opsapi.workstation.co.uk/api/v2/public/shop/stripe/webhook
#   SHOP_BFF_KEY                random ≥32-byte key; same value in workstation-shop/test/config
shop:
  allowedOrigins: "https://test-shop.workstation.co.uk,http://localhost:3200"
  publicUrl: "https://test-shop.workstation.co.uk"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

{{- /*
HA Phase 0 — one-shot DB migrate + namespace seed.

Runs ONCE per deploy, as a pre-upgrade Helm hook, BEFORE the new pods roll.
Migrations used to run in every pod's postStart; that races the moment
replicaCount > 1 (two pods both see migration N un-applied and both try it).
Moving it here decouples migration from pod startup so the app tier can scale
to multiple replicas safely.

The migrate script is INLINED here (not read from the -cm- ConfigMap): a
pre-upgrade hook runs BEFORE the updated ConfigMap is applied, so it would see
the OLD ConfigMap without this deploy's migrate.sh. Inlining keeps the Job
self-contained. NOTE: this is the same logic as `migrate.sh` in configmaps.yaml
(used only by the dev/no-ESO in-pod fallback) — keep the two in sync.

pre-upgrade (NOT pre-install): the `{{ .Release.Name }}-secrets` Secret is
created by the ExternalSecret (ESO) in the main phase, so it does not exist yet
during pre-install hooks. On a brand-new install run migrate once manually (or
let the first `helm upgrade` do it). Helm blocks the upgrade until this Job
succeeds — a failed migration stops the rollout instead of shipping bad pods.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        job: migrate
    spec:
      restartPolicy: Never
      # Same placement rules as the app: migrate must reach the same Postgres.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - lubuntu001
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -eo pipefail
              set -x

              # lapis migrate/exec read the DB config from /app/config.lua, so
              # stage it from the mounted secret first (same as the pod does).
              cp /tmp/secrets/config.lua /app/config.lua

              echo "[migrate] PROJECT_CODE=${PROJECT_CODE:-<unset>} POSTGRES_DB=${POSTGRES_DB:-<from config>}"

              # Reconcile the migration ledger against the live schema BEFORE
              # migrating. If lapis_migrations records a migration as applied but
              # the relation it created is gone (restore drift, a migration once
              # run against the wrong DB, a manual drop), Lapis would SKIP it and
              # a later FK-dependent migration would die with `relation "X" does
              # not exist` (acc, 2026-05-14, 22h outage). reconcile() un-records
              # such phantom entries so `lapis migrate` re-applies them. Non-fatal.
              echo "[migrate] Reconciling migration ledger against live schema..."
              if ! lapis exec "require('scripts.reconcile-migrations').reconcile()"; then
                echo "[migrate] Reconcile step errored (non-fatal) — proceeding to migrate." >&2
              fi

              echo "[migrate] Running migrations..."
              MIGRATE_RETRIES=5
              MIGRATE_DELAY=6
              attempt=1
              while [ $attempt -le $MIGRATE_RETRIES ]; do
                if lapis migrate; then
                  break
                fi
                echo "[migrate] Migration attempt $attempt/$MIGRATE_RETRIES failed. Retrying in ${MIGRATE_DELAY}s..."
                attempt=$((attempt + 1))
                sleep $MIGRATE_DELAY
              done
              if [ $attempt -gt $MIGRATE_RETRIES ]; then
                echo "[migrate] Migrations failed after $MIGRATE_RETRIES attempts. Aborting." >&2
                exit 1
              fi
              echo "==========================="

              echo "[migrate] Running namespace setup (supports multi-project codes)..."
              if ! lapis exec "require('scripts.setup-namespace').runMulti({})"; then
                echo "[migrate] Namespace setup failed — check above for which project code failed." >&2
                exit 1
              fi
              echo "[migrate] Namespace setup complete."
              echo "==========================="
          volumeMounts:
            - name: {{ .Release.Name }}-vol-{{ .Release.Namespace }}
              mountPath: /tmp/secrets
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            # ── Mirror of the DB / project / seed env from deployment.yaml that
            # migration + namespace-setup need. Runtime-only vars (CORS_*,
            # MINIO_*, OTP_SUPPRESS, mail banner) are intentionally omitted.
            # KEEP IN SYNC with deployment.yaml. ────────────────────────────────
            # config.lua only defines the "production" block, so lapis must run
            # in that environment or it picks an empty "development" config and
            # has no DB.
            - name: LAPIS_ENVIRONMENT
              value: "production"
            - name: POSTGRES_SSL
              value: {{ .Values.postgresSsl | default "true" | quote }}
            {{- if and .Values.database .Values.database.name }}
            # DB isolation: migrate THIS release's own database, not the shared
            # `opsapi` default baked into config.lua.
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            {{- end }}
            - name: PROJECT_CODE
              value: {{ .Values.projectCode | default "all" | quote }}
            {{- if and .Values.setup .Values.setup.adminEmail }}
            - name: ADMIN_EMAIL
              value: {{ .Values.setup.adminEmail | quote }}
            {{- end }}
            {{- if and .Values.setup .Values.setup.adminPassword }}
            - name: ADMIN_PASSWORD
              value: {{ .Values.setup.adminPassword | quote }}
            {{- end }}
            {{- if and .Values.setup .Values.setup.namespaceSlug }}
            - name: NAMESPACE_SLUG
              value: {{ .Values.setup.namespaceSlug | quote }}
            {{- end }}
            {{- if .Values.frontendUrl }}
            - name: FRONTEND_URL
              value: {{ .Values.frontendUrl | quote }}
            {{- end }}
            {{- if .Values.passwordResetAllowedOrigins }}
            - name: PASSWORD_RESET_ALLOWED_ORIGINS
              value: {{ .Values.passwordResetAllowedOrigins | quote }}
            {{- end }}
      volumes:
        - name: {{ .Release.Name }}-vol-{{ .Release.Namespace }}
          secret:
            secretName: "{{ .Release.Name }}-secrets"
            items:
              - key: LAPIS_CONFIG_LUA_FILE
                path: config.lua
{{- end }}

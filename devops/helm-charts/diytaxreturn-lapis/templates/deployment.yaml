apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Stakater Reloader watches the data hash of every Secret / ConfigMap
    # this Deployment references via envFrom or secretKeyRef. When the
    # hash changes — e.g. ExternalSecrets syncs a Vault update — Reloader
    # triggers a rolling restart so workers pick up the new values. Without
    # this annotation, ESO-driven Secret updates never reach running pods.
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  # Default kube RollingUpdate with replicaCount=1 uses maxUnavailable=0 and
  # maxSurge=1, so a node-pinned release needs a free pod slot on that node
  # before the old pod can terminate. On a full node (Too many pods) that
  # deadlocks the rollout — use Recreate (or maxUnavailable:1) for pinned
  # single-replica releases. See values-workstation-int.yaml.
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # The postStart bootstrap attaches to nginx via `lapis exec`, which must
      # signal the nginx master from the hook's exec session. On Ubuntu nodes
      # the kernel mediates AppArmor signals and exec sessions run under a
      # stacked label (cri-containerd.apparmor.d//&unconfined), so the kill is
      # denied and the hook fails -> CrashLoopBackOff (int, lubuntu001,
      # 2026-08-05). Debian nodes do not mediate signals. Keep this workload
      # off Ubuntu nodes until the node profile allows cross-label signals.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - lubuntu001
      {{- with .Values.nodeSelector }}
      # Optional hard node pin (per-release, via values). Combines with the
      # NotIn-lubuntu001 affinity above. Used by workstation-opsapi to keep the
      # pod on a debian node with disk headroom (debworker00).
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "stat -c %a /tmp && ls -la /tmp && cp /tmp/configmap/bootstrap-nginx.sh /usr/local/bin/bootstrap-nginx.sh && chmod +x /usr/local/bin/bootstrap-nginx.sh && /bin/sh /usr/local/bin/bootstrap-nginx.sh"]
          volumeMounts:
            - name: {{ .Release.Name }}-cm-{{ .Release.Namespace }}-vol
              mountPath: /tmp/configmap
            - name: {{ .Release.Name }}-vol-{{ .Release.Namespace }}
              mountPath: /tmp/secrets
          ports:
            - containerPort: {{ .Values.containerPort | default 80 }}
          startupProbe:
            httpGet:
              path: /live
              port: {{ .Values.containerPort | default 80 }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.containerPort | default 80 }}
            timeoutSeconds: 3
            failureThreshold: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.containerPort | default 80 }}
            timeoutSeconds: 10
            periodSeconds: 15
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: LAPIS_ENVIRONMENT
              value: "production"
            # Deployment-environment label used by helper/mail.lua to
            # decide whether to inject the non-prod debug banner +
            # [ENV] subject prefix. We can't reuse LAPIS_ENVIRONMENT
            # here because it's hardcoded "production" above so the
            # secret-templated config.lua's single `config("production")`
            # block is selected — without this split, the banner would
            # never fire on dev/test/int/acc.
            #
            # Values: dev / test / int / acc / prod — matches the suffix
            # of values-*.yaml. helper/mail.lua treats both "prod" and
            # "production" as prod (is_production_env), so prod
            # deployments get no banner.
            - name: OPSAPI_DEPLOY_ENV
              value: {{ .Values.env | quote }}
            # The k3s Zalando Postgres enforces TLS (pg_hba: `hostnossl all
            # all all reject`); config.lua reads POSTGRES_SSL to turn on
            # pgmoon SSL (ssl_verify=false for the self-signed cert). This
            # chart only ever deploys to k8s/Zalando environments, so SSL is
            # always required here. Without it every DB call is rejected with
            # "no encryption" and the whole API 500s.
            - name: POSTGRES_SSL
              value: {{ .Values.postgresSsl | default "true" | quote }}
            {{- if and .Values.database .Values.database.name }}
            # DATABASE ISOLATION. By default this release inherits POSTGRES_DB
            # from the shared Vault ExternalSecret (envFrom above) — which is
            # the SAME `opsapi` database the legacy diytaxreturn-lapis release
            # uses. Setting `database.name` points THIS release at its own
            # database on the same Postgres server, so its data (users,
            # namespaces, tenants) is fully isolated from diytaxreturn's. An
            # explicit container `env` WINS over the `envFrom` secretRef for the
            # same key, and config.lua + `lapis migrate` both read
            # os.getenv("POSTGRES_DB"), so the app and the postStart migration
            # hook agree. The target database MUST already exist on the server
            # (pguser lacks CREATEDB) — provision it once before first deploy:
            #   CREATE DATABASE <name> OWNER pguser;
            # then the postStart bootstrap migrates it fresh + seeds the admin.
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            {{- end }}
            # PCRE pattern (matched via ngx.re.match) of recipients
            # whose SMTP delivery must be silently skipped. Used by
            # helper/mail.lua + helper/otp.lua; gated internally on
            # is_production_env, so this is a no-op in prod even when
            # set — safe to default for every env. Covers three known
            # non-deliverable sinks that otherwise generate Mail
            # Delivery Subsystem bounces back to SMTP_FROM_EMAIL:
            #   - legacy `diytaxreturnmail+e2e-…@gmail.com` E2E pattern
            #   - `*@e2e.invalid` E2E sink (RFC 6761 reserved TLD)
            #   - `*@admin.com` test-admin user (MX times out to 127.0.0.1)
            - name: OTP_SUPPRESS_FOR_EMAIL_REGEX
              value: {{ .Values.otpSuppressForEmailRegex | default "^diytaxreturnmail\\+e2e-.*@gmail\\.com$|@e2e\\.invalid$|@admin\\.com$" | quote }}
            - name: PROJECT_CODE
              value: {{ .Values.projectCode | default "all" | quote }}
            {{- if and .Values.setup .Values.setup.adminEmail }}
            - name: ADMIN_EMAIL
              value: {{ .Values.setup.adminEmail | quote }}
            {{- end }}
            {{- if and .Values.setup .Values.setup.adminPassword }}
            - name: ADMIN_PASSWORD
              value: {{ .Values.setup.adminPassword | quote }}
            {{- end }}
            {{- if and .Values.setup .Values.setup.namespaceSlug }}
            - name: NAMESPACE_SLUG
              value: {{ .Values.setup.namespaceSlug | quote }}
            {{- end }}
            # ── Password reset email links + allow-list bootstrap ──────────
            # These two env vars feed migration 489's auto-bootstrap of
            # ``namespaces.allowed_redirect_origins`` AND the legacy
            # env-var fallback in /auth/forgot-password (defence in
            # depth for any namespace whose column is empty at runtime).
            #
            # ``frontendUrl``  = canonical primary frontend for this tenant.
            # ``passwordResetAllowedOrigins`` = optional comma-separated
            # extras for multi-frontend tenants (staging + prod, or
            # per-region domains).
            #
            # See README.md → Password Reset Flow for the full lookup
            # priority chain.
            {{- if .Values.frontendUrl }}
            - name: FRONTEND_URL
              value: {{ .Values.frontendUrl | quote }}
            {{- end }}
            {{- if .Values.passwordResetAllowedOrigins }}
            - name: PASSWORD_RESET_ALLOWED_ORIGINS
              value: {{ .Values.passwordResetAllowedOrigins | quote }}
            {{- end }}
            # ── Browser CORS allow-list ────────────────────────────────────
            # Consumed by lapis/middleware/cors.lua. Without a match the
            # middleware sets NO Access-Control-Allow-Origin and the browser
            # blocks the call — this is what broke public marketing-site form
            # posts to /api/v2/public/leads/:namespace_slug from
            # https://diytaxreturn.co.uk (prod returned 204 + Vary: Origin
            # but no ACAO header).
            #
            # ``corsAllowedDomains``  = comma-separated bare domains. Each one
            # matches the apex AND every subdomain, http or https, any port
            # (so "diytaxreturn.co.uk" also covers www./app./acc.).
            # ``corsAllowedOrigins``  = comma-separated exact origins, for
            # hosts that aren't under an allowed domain (e.g. a preview URL).
            #
            # Both are OPTIONAL here: when unset, whatever Vault ships in the
            # ExternalSecret (envFrom above) still applies. When set, this
            # env entry WINS over envFrom for that key — so only set them in
            # values-*.yaml for envs where git should own the allow-list.
            {{- if .Values.corsAllowedDomains }}
            - name: CORS_ALLOWED_DOMAINS
              value: {{ .Values.corsAllowedDomains | quote }}
            {{- end }}
            {{- if .Values.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.corsAllowedOrigins | quote }}
            {{- end }}
      volumes:
        - name: {{ .Release.Name }}-cm-{{ .Release.Namespace }}-vol
          configMap:
            name: {{ .Release.Name }}-cm-{{ .Release.Namespace }}
        - name: {{ .Release.Name }}-vol-{{ .Release.Namespace }}
          secret:
            secretName: "{{ .Release.Name }}-secrets"
            items:
            - key: LAPIS_CONFIG_LUA_FILE
              path: config.lua

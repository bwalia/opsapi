{{- if gt (int .Values.replicaCount) 1 }}
# Voluntary disruptions (node drain, cluster upgrade) never take every replica
# at once. Rollouts are governed by the Deployment strategy, not this.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
{{- end }}

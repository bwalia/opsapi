apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cm-{{ .Release.Namespace }}
#   namespace: {{ .Values.targetNS }}
data:
    # PER-POD nginx bootstrap (postStart). Runs on EVERY pod start, so it must
    # stay idempotent and cheap and do NO cluster-wide work. Database migrations
    # + namespace seeding moved OUT of here into the one-shot `migrate.sh` run by
    # the pre-upgrade Helm hook Job (migrate-job.yaml) — otherwise every replica
    # would migrate concurrently, which races once replicaCount > 1 (HA Phase 0).
    bootstrap-nginx.sh: |
        #!/bin/bash
        # Fail fast on any error so readiness probe keeps failing until bootstrap succeeds.
        set -eo pipefail
        set -x

        FILE=/app/config.lua
        cp /tmp/secrets/config.lua $FILE

        # Patch nginx resolver to include K8s CoreDNS for internal service resolution
        KUBE_DNS=$(grep nameserver /etc/resolv.conf | head -1 | awk '{print $2}')
        if [ -n "$KUBE_DNS" ] && [ -f /app/nginx.conf ]; then
          sed -i "s/resolver 8.8.8.8 8.8.4.4/resolver ${KUBE_DNS} 8.8.8.8 8.8.4.4/" /app/nginx.conf
          echo "[bootstrap] Patched nginx resolver with K8s DNS: ${KUBE_DNS}"
        fi

        echo "[bootstrap] PROJECT_CODE=${PROJECT_CODE:-<unset>} (migrations run in the pre-upgrade hook Job, not here)"
{{- if not .Values.externalSecret.enabled }}

        # DEV FALLBACK: with no ExternalSecret there is no `{{ .Release.Name }}-secrets`
        # for a pre-upgrade hook Job to mount, so no migrate Job runs. Migrate
        # in-pod here instead. Safe because these envs are single-replica; do NOT
        # rely on this once you scale replicaCount > 1 (enable externalSecret).
        cp /tmp/configmap/migrate.sh /usr/local/bin/migrate.sh
        chmod +x /usr/local/bin/migrate.sh
        /bin/sh /usr/local/bin/migrate.sh
{{- end }}

        mkdir -p /tmp/ && chown nobody /tmp/ && touch /tmp/swagger.json
        chown nobody /tmp/swagger.json && chmod 755 /tmp/swagger.json
        cp /app/api-docs/swagger.json /tmp/swagger.json

    # ONE-SHOT migrate + seed, run by the pre-upgrade/pre-install Helm hook Job
    # (migrate-job.yaml) exactly ONCE per deploy, BEFORE the new pods roll. This
    # is what makes replicaCount > 1 safe: no per-pod migration races.
    migrate.sh: |
        #!/bin/bash
        set -eo pipefail
        set -x

        # lapis migrate / exec read the DB config from /app/config.lua, so stage
        # it from the mounted secret first (same as the pod does).
        cp /tmp/secrets/config.lua /app/config.lua

        echo "[migrate] PROJECT_CODE=${PROJECT_CODE:-<unset>} POSTGRES_DB=${POSTGRES_DB:-<from config>}"

        # Reconcile the migration ledger against the live schema BEFORE migrating.
        # If lapis_migrations records a migration as applied but the relation it
        # created is gone (DB restore drift, a migration once run against the
        # wrong DB, a manual drop), Lapis would otherwise SKIP it and a later
        # FK-dependent migration would die with `relation "X" does not exist`
        # (acc, 2026-05-14, 22h outage). reconcile() un-records such phantom
        # entries so `lapis migrate` re-applies them. Non-fatal.
        echo "[migrate] Reconciling migration ledger against live schema..."
        if ! lapis exec "require('scripts.reconcile-migrations').reconcile()"; then
          echo "[migrate] Reconcile step errored (non-fatal) — proceeding to migrate." >&2
        fi

        echo "[migrate] Running migrations..."
        # Retry — Postgres may still be coming up when the hook fires.
        MIGRATE_RETRIES=5
        MIGRATE_DELAY=6
        attempt=1
        while [ $attempt -le $MIGRATE_RETRIES ]; do
          if lapis migrate; then
            break
          fi
          echo "[migrate] Migration attempt $attempt/$MIGRATE_RETRIES failed. Retrying in ${MIGRATE_DELAY}s..."
          attempt=$((attempt + 1))
          sleep $MIGRATE_DELAY
        done
        if [ $attempt -gt $MIGRATE_RETRIES ]; then
          echo "[migrate] Migrations failed after $MIGRATE_RETRIES attempts. Aborting." >&2
          exit 1
        fi
        echo "==========================="

        echo "[migrate] Running namespace setup (supports multi-project codes)..."
        # runMulti() validates every project code, isolates per-code failures with
        # pcall, and re-raises on partial failure so this Job exits non-zero and the
        # deploy stops until an operator intervenes.
        if ! lapis exec "require('scripts.setup-namespace').runMulti({})"; then
          echo "[migrate] Namespace setup failed — check above for which project code failed." >&2
          exit 1
        fi
        echo "[migrate] Namespace setup complete."
        echo "==========================="

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pg-backup-{{ .Release.Namespace }}
#   namespace: {{ .Values.targetNS }} kubectl get configmap opsapi-pg-backup-test -n test -o yaml
data:
    backup-database.sh: |
      #!/bin/bash
      set -x
      TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
      BACKUP_FILE="backup_$TIMESTAMP.sql.gz"

      pg_dump -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -F c | gzip > "/tmp/$BACKUP_FILE"

      # Install MinIO Client
      curl -fSL --retry 3 -o mc https://dl.min.io/client/mc/release/linux-amd64/mc
      chmod +x mc && mv mc /usr/local/bin/

      # Configure MinIO and upload backup
      mc alias set myminio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
      mc cp "/tmp/$BACKUP_FILE" myminio/"$MINIO_BUCKET"/"$BACKUP_FILE"

      # Cleanup
      rm -f "/tmp/$BACKUP_FILE"

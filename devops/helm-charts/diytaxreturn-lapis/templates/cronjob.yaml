# Source: opsapi/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name:  {{ .Values.app }}-{{ .Release.Namespace }}-db-backup-hourly
spec:
  schedule: "0 * * * *"
  #testing 1 min "0 */1 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          # Backups pg_dump the release's own DB (POSTGRES_HOST below), so they
          # must run where that DB is reachable. Follow the release's placement:
          # the prod release pins app + workstation-db to cloud003 (an edge node),
          # so the backup pod must land there too and tolerate the edge taint.
          # Values-driven → no effect for releases that set neither.
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: "opsapi-db-backup-{{ .Release.Namespace }}-hourly"
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "Connecting to PostgreSQL at: $POSTGRES_HOST"

                  # Load environment variables
                  export PGPASSWORD="$POSTGRES_PASSWORD"

                  # Check if we can reach the PostgreSQL server
                  pg_isready -h "$POSTGRES_HOST" -p $POSTGRES_PORT -U "$POSTGRES_USER"

                  # Set backup file name with timestamp
                  BACKUP_FILE="/tmp/backup_$(date +'%Y-%m-%d_%H-%M-%S').sql.gz"

                  echo "Starting PostgreSQL backup..."

                  # ✅ Force TCP connection by explicitly setting -h and -p
                  pg_dump -h "$POSTGRES_HOST" -p $POSTGRES_PORT -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$BACKUP_FILE"

                  echo "Backup completed: $BACKUP_FILE"
                  if [ ! -f "$BACKUP_FILE" ]; then
                    echo "Error: Backup file was not created!"
                    exit 1
                  fi
                  # Install MinIO Client
                  curl -fSL --retry 3 -o mc https://dl.min.io/client/mc/release/linux-amd64/mc
                  chmod +x mc && mv mc /usr/local/bin/

                  # Debugging: Ensure MinIO variables are set
                  echo "MinIO Endpoint: $MINIO_ENDPOINT"
                  echo "MinIO Bucket: $MINIO_BUCKET"

                  if [[ -z "$MINIO_ENDPOINT" || -z "$MINIO_BUCKET" ]]; then
                      echo "Error: MINIO_ENDPOINT or MINIO_BUCKET is not set"
                      exit 1
                  fi

                  # ✅ Set MinIO alias
                  mc alias set myminio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"

                  # ✅ Debug: Check if file exists before copying
                  ls -lh "$BACKUP_FILE"

                  # ✅ Ensure the backups bucket exists (a fresh MinIO — e.g. this
                  # release's own workstation-minio — won't have it yet), then upload.
                  mc mb --ignore-existing myminio/"opsapi-test-pg"
                  echo "Uploading backup to MinIO..."
                  mc cp "$BACKUP_FILE" myminio/"opsapi-test-pg"/ || { echo "MinIO upload failed!"; exit 1; }

                  echo "Backup successfully uploaded to MinIO."
              volumeMounts:
                - name: {{ .Release.Name }}-backup-script
                  mountPath: /scripts
                  readOnly: true
                - name: {{ .Release.Name }}-backup-storage
                  mountPath: /backup

              env:
                # MinIO: prefer THIS release's own store (.Values.minio) so the
                # backup uploads to a REACHABLE MinIO with matching creds. The
                # shared Vault secret points at diytaxreturn-minio (cloud region),
                # which a LAN-pinned backup pod cannot reach — same root cause as
                # the app deployment. Falls back to the Vault secret for releases
                # that set no minio block (legacy diytaxreturn-lapis), so their
                # behaviour is unchanged. Mirrors the deployment.yaml override.
                - name: MINIO_ENDPOINT
                  {{- if and .Values.minio .Values.minio.endpoint }}
                  value: {{ .Values.minio.endpoint | quote }}
                  {{- else }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: MINIO_ENDPOINT
                  {{- end }}
                - name: MINIO_ACCESS_KEY
                  {{- if and .Values.minio .Values.minio.credsSecret }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.minio.credsSecret | quote }}
                      key: {{ .Values.minio.accessKeyKey | default "MINIO_ROOT_USER" | quote }}
                  {{- else }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: MINIO_ACCESS_KEY
                  {{- end }}
                - name: MINIO_SECRET_KEY
                  {{- if and .Values.minio .Values.minio.credsSecret }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.minio.credsSecret | quote }}
                      key: {{ .Values.minio.secretKeyKey | default "MINIO_ROOT_PASSWORD" | quote }}
                  {{- else }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: MINIO_SECRET_KEY
                  {{- end }}
                - name: MINIO_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: MINIO_BUCKET
                - name: POSTGRES_HOST
                  {{- if and .Values.database .Values.database.host }}
                  # Isolation: back up from THIS release's own Postgres host
                  # (database.host — the dedicated workstation-db), not the
                  # shared Vault POSTGRES_HOST, so the dump targets the same
                  # server the app writes to.
                  value: {{ .Values.database.host | quote }}
                  {{- else }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: POSTGRES_HOST
                  {{- end }}
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: POSTGRES_PORT
                - name: POSTGRES_DB
                  {{- if and .Values.database .Values.database.name }}
                  # Isolation: back up THIS release's own database (see the
                  # POSTGRES_DB override in deployment.yaml), not the shared
                  # secret's POSTGRES_DB — otherwise this release would dump the
                  # co-tenant's database instead of its own.
                  value: {{ .Values.database.name | quote }}
                  {{- else }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: POSTGRES_DB
                  {{- end }}
          volumes:
            - name: {{ .Release.Name }}-backup-script
              configMap:
                name: {{ .Release.Name }}-pg-backup-{{ .Release.Namespace }}
                defaultMode: 0777  # Make it executable
            - name: {{ .Release.Name }}-backup-storage
              emptyDir: {}
      backoffLimit: 0
---

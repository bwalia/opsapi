# ── OpsAPI on workstation.co.uk — INTEGRATION ──────────────────────────────
# Helm RELEASE: workstation-opsapi   Namespace: int   Cluster: k3s1
# Public host: https://int-opsapi.workstation.co.uk
#
# This file describes the NEW `workstation-opsapi` release — a dedicated
# deployment that owns its own Ingress for the *-opsapi.workstation.co.uk
# host. It is deliberately SEPARATE from values-int.yaml (which drives the
# legacy `diytaxreturn-lapis` release still serving *.diytaxreturn.co.uk).
# The two releases share the chart, the namespace, and the same Vault-backed
# secret data, but have distinct release names so nothing on the old domain
# is disturbed. See deploy-k3s.yml.
env: int
app: workstation-opsapi

# Single source of truth for the DNS + wslproxy jobs (deploy-k3s.yml reads
# this `host:` via awk). MUST equal ingress.hosts[0].host below.
host: int-opsapi.workstation.co.uk

# Full opsapi product on its OWN isolated database (see `database` below), so
# `all` is safe here: every migration runs against the dedicated
# workstation_opsapi DB and cannot affect diytaxreturn's data. `all` enables
# every feature module (incl. SERVICES/Domains) so the admin dashboard shows
# the complete product. The "CRM drift took acc down 22h" caveat in
# values-int.yaml applied to the SHARED diytaxreturn DB — it does not apply to
# this isolated release.
projectCode: all

# Plain, non-secret env for this release (templates/deployment.yaml → extraEnv).
extraEnv:
  # Voice for the assistant (lapis/routes/voice.lua): the self-hosted Speaches server
  # (faster-whisper + Kokoro) next to Ollama on the LAN. Audio never leaves our machines.
  # Server-to-server plain http on 8014; https://192.168.1.177:8015 (Caddy, self-signed) is for browsers
  # (Speaches' own page needs https for the microphone).
  VOICE_URL: "http://192.168.1.177:8014"
  VOICE_TTS_VOICE: "bf_emma"
  # AI runs on the self-hosted Ollama (OLLAMA_* in Vault), which takes ~40s per
  # transaction classification: give each call 5 min and keep only 2 in flight so
  # queued ones don't time out. Another model = AI_PROVIDER/AI_MODEL/AI_API_KEY here
  # or in Vault — no code change (lapis/.sample.env).
  AI_REQUEST_TIMEOUT_MS: "300000"
  AI_CLASSIFY_CONCURRENCY: "2"
  # CMS featured-image upload → public www S3 (lapis/helper/cms-public-media.lua).
  # Secrets CMS_PUBLIC_S3_ACCESS_KEY + CMS_PUBLIC_S3_SECRET_KEY live in Vault
  # workstation-opsapi/int/config (or AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
  CMS_PUBLIC_S3_BUCKET: "workstation-website"
  CMS_PUBLIC_S3_REGION: "eu-west-2"
  CMS_PUBLIC_BASE_URL: "https://www.workstation.co.uk"

# Password-reset / invite links → the workstation admin UI for this ring.
# Migration 489 bootstraps namespaces.allowed_redirect_origins from this.
frontendUrl: "https://int-opsapi-ui.workstation.co.uk"

image:
  repository: bwalia/opsapi
  tag: latest
  pullPolicy: Always

# Two pods + Redis (chat events cross pods through it), like acc/test: a deploy,
# Vault-driven reload (Reloader), crash or node drain no longer takes the API
# down. Placement is the LAN amd64 pool (see nodeSelector), which has spare pod
# slots, so the chart's default RollingUpdate (maxUnavailable 0, maxSurge 1)
# applies — the old Recreate override was for when this was pinned to the full
# debworker00.
replicaCount: 2
redis:
  enabled: true

service:
  type: ClusterIP
  port: 80

# Dedicated Ingress for this release. The WSL Proxy edge terminates TLS and
# proxies to the shared k3s ingress entry 193.237.176.232:8888 (the
# opsapi-prod-default rule backend), which routes by Host header over plain
# HTTP — so NO cert-manager and NO tls block here.
#
# className is `traefik-edge`, which is what actually serves the working
# *.workstation.co.uk hosts behind that edge (beacon, int.workstation.co.uk).
# It was `wslproxy` until 2026-09-19, when every host on that class started
# returning a bare "404 page not found": the wslproxy ingress controller cannot
# program its own data plane, because the OpenResty it pushes backends to runs
# the main bwalia/wslproxy image, whose nginx config puts /api/* behind the
# dashboard JWT. The controller sends no token, so each push is refused with
# `401 Missing token`, and when the OpenResty pods restarted they came back with
# no routes at all. Move back to `wslproxy` once the controller authenticates to
# that API (or the ingress-controller chart's own nginx.conf, which leaves
# /api/internal open in-cluster, is the one actually deployed).
ingress:
  enabled: true
  className: traefik-edge
  annotations: {}
  hosts:
    - host: int-opsapi.workstation.co.uk
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Schedule on ANY healthy LAN amd64 node, not one pinned host. Single-node pins
# kept breaking this: debworker00 hit its 110/110 pod cap, then debian010 went
# NotReady (unreachable) and the pinned pods sat Pending for ~18h. The label set
# below lets the scheduler pick from the whole LAN amd64 pool and skip
# tainted/unreachable/full nodes on its own — a node dying no longer needs a
# manual re-pin.
#   net-region=home       → on the LAN; reaches workstation-db (a ClusterIP on the
#                           LAN). Excludes cloud nodes (net-region=manchester),
#                           which are across the down cloud<->LAN WireGuard mesh.
#   kubernetes.io/arch=amd64 → excludes the arm64 Pi (rpworker99); the amd64 image
#                           cannot exec there ("exec docker-entrypoint.sh: no such
#                           file or directory").
# Combines with the chart's NotIn-lubuntu001 affinity. Routing is independent of
# placement — traefik-edge reaches this ClusterIP Service wherever the pod runs.
nodeSelector:
  net-region: home
  kubernetes.io/arch: amd64

# DATABASE — dedicated Postgres on the LAN (moved here 2026-08-19).
#   `host` points this release at its OWN `workstation-db` Postgres
#   (devops/k8s/workstation-db.yaml — pgvector/pgvector:pg15 pinned to
#   debworker00), NOT the shared Zalando `diy-tax-db`. Why the move: diy-tax-db
#   runs on a cloud edge node (cloud002) whose `local-path` volume was wiped on
#   reschedule — dropping workstation_opsapi — and the cloud<->LAN WireGuard mesh
#   is down, so a LAN-pinned app (nodeSelector debworker00) cannot reach a
#   cloud-pinned DB. A dedicated LAN DB co-located with the app + wslproxy
#   ingress removes that cross-segment dependency entirely (data isolation AND
#   partition-independence). The chart bakes `host` into config.lua (see
#   externalsecret.yaml) and `name` into a POSTGRES_DB env override (see
#   deployment.yaml). pguser reuses the Vault password; the database, the
#   `vector` pgvector extension (needed by the tax-classifier migration), and an
#   initdb self-heal for that extension are all provisioned by the manifest.
database:
  name: workstation_opsapi
  host: workstation-db.int.svc.cluster.local

# The dedicated workstation-db is a PLAIN Postgres with NO TLS, unlike the
# Zalando diy-tax-db which enforced it (hostnossl reject). config.lua reads
# POSTGRES_SSL (default "true" in the chart) to switch on pgmoon SSL — force it
# OFF here or every DB call is rejected with "no encryption" and the API 500s.
postgresSsl: "false"

externalSecret:
  enabled: true
  # int-opsapi.workstation.co.uk: its own WSL Vault path (see values-workstation-prod.yaml).
  secretStore: wslvault-backend
  vaultPath: workstation-opsapi/int/config

# MINIO — this release's OWN isolated object store (workstation-minio), NOT
# diytaxreturn's. See devops/k8s/workstation-minio.yaml. Without this the app
# inherits MINIO_* from the shared Vault secret, which points at
# diytaxreturn-minio in the cloud region — unroutable from this LAN-pinned pod,
# so server-side uploads time out (int-opsapi.workstation.co.uk/health showed
# minio "degraded": internal endpoint timeout). `endpoint` is the LAN ClusterIP
# (reachable, same region as this pod); `externalUrl` is workstation-minio's own
# ingress (already defined in workstation-minio.yaml) used for browser image
# URLs; creds come from workstation-minio-creds so they always match the server
# (the app auto-creates its bucket on first upload).
minio:
  endpoint: http://workstation-minio.int.svc.cluster.local:9000
  externalUrl: https://int-minio.workstation.co.uk
  credsSecret: workstation-minio-creds

# Bootstrap super-admin for the fresh workstation_opsapi DB (created on first
# boot by scripts/setup-namespace). Email is safe to commit; the password is
# NOT set here (this repo is public) — it defaults to the setup-namespace
# default on a fresh seed and should be rotated after first login. The seeded
# admin owns the `workstation` namespace and holds the platform `administrative`
# role. Once the admin exists, setup-namespace is idempotent and never rewrites
# the password, so redeploys are safe.
setup:
  adminEmail: "tenthmatrix.mailer@gmail.com"
  adminPassword: ""
  namespaceSlug: "workstation"

# Browser CORS allow-list (consumed by middleware/cors.lua). The admin UI
# dashboard is served from *-opsapi-ui.workstation.co.uk and calls this API
# cross-origin; without an allow-list match the middleware emits no
# Access-Control-Allow-Origin and the browser blocks every call. The bare
# domain matches the apex AND every subdomain (http/https, any port), so it
# covers int-opsapi-ui.workstation.co.uk and the other env UI hosts.
#
# workstation.academy is added because the Workstation Academy is now a tenant
# of this shared opsapi: its instructor dashboard (int-teach.workstation.academy)
# is a cross-origin browser client of this API. Additive — the existing
# workstation.co.uk origins are unaffected.
corsAllowedDomains: "workstation.co.uk,workstation.academy,tenthmatrix.com,tenthmatrix.co.uk"

# Google sign-in returns here, not to the diytaxreturn API in the shared Vault
# secret. Must be an authorised redirect URI on the Google OAuth client.
googleRedirectUri: "https://int-opsapi.workstation.co.uk/auth/google/callback"
# HMRC "Connect" returns here, not to the diytaxreturn API in the shared Vault
# secret (a different database, so the connection never showed up). Must be
# listed under Redirect URIs on the HMRC Developer Hub sandbox application.
hmrcRedirectUri: "https://int-opsapi.workstation.co.uk/auth/hmrc/callback"
# The HMRC sandbox app with that redirect URI registered is not the one in the
# shared Vault, so its pair lives in this Secret (created by hand in `int`).
# Drop this once workstation-opsapi/int/config in Vault holds the same pair.
hmrcCredentialsSecret: "workstation-opsapi-hmrc-override"
# Model override for int without Vault access: put AI_PROVIDER, AI_MODEL and the
# provider's key (e.g. GEMINI_API_KEY) in this Secret; pods restart on change
# (Reloader). Absent = the Vault/Ollama defaults.
extraEnvFromSecrets:
  - "workstation-opsapi-ai-override"
# PROJECT_CODE is "all" here, which names no tenant: new sign-ups join Workstation.
signupNamespaceSlug: "workstation"
# Workstation's own Google OAuth client (not diytaxreturn's). Its secret goes in
# Vault as GOOGLE_CLIENT_SECRET; both redirect URIs must be on this client.
googleClientId: "331816273930-262h0rp98v6qc55gve0clc3m3b4bp0ha.apps.googleusercontent.com"
# Facebook sign-in for shop customers returns here. Add it to the Facebook app's
# Valid OAuth Redirect URIs; FACEBOOK_APP_ID + FACEBOOK_APP_SECRET go in Vault.
facebookRedirectUri: "https://int-opsapi.workstation.co.uk/auth/facebook/callback"

# Workstation AI Shop (shop.workstation.co.uk, workstation-website/shop).
# Plain config → SHOP_ALLOWED_ORIGINS / SHOP_PUBLIC_URL container env (see
# templates/deployment.yaml). allowedOrigins gates /checkout success/cancel URLs.
# Secrets are NOT here — add them to Vault secret/diytaxreturnuk/opsapi/int/config
# (both optional; shop payments stay disabled until set):
#   STRIPE_SHOP_WEBHOOK_SECRET  whsec_… for https://int-opsapi.workstation.co.uk/api/v2/public/shop/stripe/webhook
#   SHOP_BFF_KEY                random ≥32-byte key; same value in workstation-shop/int/config
shop:
  allowedOrigins: "https://int-shop.workstation.co.uk,http://localhost:3200"
  publicUrl: "https://int-shop.workstation.co.uk"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Plugins from private repos, copied into /app/projects at deploy time (templates/_plugins.tpl).
# portfoliolab = Joy AI for Portfolio Lab (private repo bwalia/joyai), PoC in the leadsmagnet
# workspace. `:int` is rebuilt by that repo's CI; Always so each deploy picks up the latest.
pluginOverlays:
  - name: portfoliolab
    image: int-spectoncr.diytaxreturn.co.uk/joyai/portfoliolab-plugin:int
    pullPolicy: Always
imagePullSecrets:
  - name: nebulacr-login

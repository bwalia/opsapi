env: prod
app: diytaxreturn-lapis
# Scope migrations + namespace setup to the tax app only. With "all",
# this deployment would run (and own) migrations for every platform
# project — ecommerce, hospital, crm, kanban, … — none of which the
# DIY Tax Return app uses. A CRM migration drift took acc opsapi down
# for 22h on 2026-05-14; "tax_copilot" makes that class of failure
# impossible since non-tax migration modules are never loaded.
projectCode: tax_copilot

# ─── Password reset email link target ─────────────────────────────────
# Canonical frontend origin for production. Migration 489 uses this
# to bootstrap ``namespaces.allowed_redirect_origins`` on first run;
# runtime path also falls back to it if any namespace's column is
# empty. See README.md → Password Reset Flow.
#
# TODO: confirm the production hostname before first deploy. Likely
# values: https://app.diytaxreturn.co.uk, https://www.diytaxreturn.co.uk,
# or https://diytaxreturn.co.uk. Update before going live.
frontendUrl: "https://app.diytaxreturn.co.uk"
# passwordResetAllowedOrigins: ""

# ─── Browser CORS allow-list ──────────────────────────────────────────
# Read by lapis/middleware/cors.lua. The bare domain matches the apex and
# every subdomain (www./app./…), http or https, with or without a port —
# so this single entry covers https://diytaxreturn.co.uk,
# https://www.diytaxreturn.co.uk and https://app.diytaxreturn.co.uk.
#
# Needed for the public marketing-site form posting to
# POST /api/v2/public/leads/tax-copilot: before this, prod answered the
# preflight with 204 + `Vary: Origin` but no Access-Control-Allow-Origin,
# so the browser blocked every submission.
#
# NOTE: setting this here means git — not Vault — owns the prod
# allow-list (the env entry overrides the ExternalSecret's envFrom value).
corsAllowedDomains: "diytaxreturn.co.uk"
# Exact origins that are NOT under an allowed domain above. The two
# public site origins are listed explicitly as well so the allow-list is
# greppable and survives any future narrowing of corsAllowedDomains.
corsAllowedOrigins: "https://diytaxreturn.co.uk,https://www.diytaxreturn.co.uk"

image:
  repository: bwalia/opsapi
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: wslproxy
  annotations: {}
  hosts: []
  tls: []

externalSecret:
  enabled: true

setup:
  adminEmail: ""
  adminPassword: ""
  namespaceSlug: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

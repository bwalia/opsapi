# ── OpsAPI on workstation.co.uk — PRODUCTION ───────────────────────────────
# Helm RELEASE: workstation-opsapi   Namespace: prod   Cluster: k3s1
# Public host: https://opsapi.workstation.co.uk   (bare, no env prefix)
#
# Dedicated `workstation-opsapi` release (see values-workstation-int.yaml for
# the full story). Separate from the legacy diytaxreturn-lapis release.
# prod is NEVER auto-deployed — manual workflow_dispatch only (deploy-k3s.yml).
env: prod
app: workstation-opsapi

# Single source of truth for the DNS + wslproxy jobs. MUST equal
# ingress.hosts[0].host below.
host: opsapi.workstation.co.uk

# Full opsapi product on prod's OWN isolated DB (see `database` below), so
# `all` is safe: every migration runs against the dedicated workstation_opsapi
# DB and cannot touch diytaxreturn's data. `all` enables every feature module
# (incl. SERVICES/Domains) so the live product is the complete one — matching
# the int build that was verified end-to-end before go-live.
projectCode: all

frontendUrl: "https://app.diytaxreturn.co.uk"

image:
  repository: bwalia/opsapi
  tag: latest
  pullPolicy: Always

replicaCount: 1

# Same as values-workstation-int.yaml: Recreate avoids surge deadlock on a
# full nodeSelector-pinned node (debworker00 max-pods).
strategy:
  type: Recreate

service:
  type: ClusterIP
  port: 80

# Dedicated Ingress — plain HTTP :80 (TLS at the edge, no cert-manager on
# k3s1). className `traefik-edge`, NOT `wslproxy`: prod is pinned to cloud003,
# whose only ingress entry is the traefik-edge DaemonSet (hostNetwork :80) —
# it serves ONLY ingressclass traefik-edge, and the opsapi-prod-cloud003 edge
# rule targets it at origin-uk-003.pop0.uk (port 80). Same pattern as the
# working diytaxreturn prod ingresses. int/test/acc stay on wslproxy (LAN).
ingress:
  enabled: true
  className: traefik-edge
  annotations: {}
  hosts:
    - host: opsapi.workstation.co.uk
      paths:
        - path: /
          pathType: Prefix
  tls: []

# DATABASE — dedicated Postgres on the LAN for prod (mirrors -int). Points this
# release at its OWN `workstation-db` in the `prod` namespace
# (devops/k8s/workstation-db-prod.yaml — pgvector/pgvector:pg15 on debworker00),
# NOT the shared Vault POSTGRES_HOST. A fresh isolated DB: the app's postStart
# bootstrap migrates it and auto-creates the super admin (credentials from Vault
# — see `setup` below). The chart bakes `host` into config.lua (externalsecret
# .yaml) and `name` into a POSTGRES_DB env override (deployment.yaml). Apply the
# manifest BEFORE the first prod deploy so the DB is up when the migrate hook runs.
database:
  name: workstation_opsapi
  host: workstation-db.prod.svc.cluster.local

# workstation-db is plain Postgres with NO TLS — force pgmoon SSL off (the chart
# default "true" was for the TLS-enforcing Zalando DB). See -int for detail.
postgresSsl: "false"

externalSecret:
  enabled: true

# Bootstrap super-admin for the fresh prod workstation_opsapi DB, seeded on
# first boot by scripts/setup-namespace. The CREDENTIALS come from Vault, not
# git: adminEmail + adminPassword are left BLANK here so the chart does NOT emit
# explicit ADMIN_* container env — instead the pod's `envFrom` pulls ADMIN_EMAIL
# / ADMIN_PASSWORD out of the ESO-synced `workstation-opsapi-secrets` (Vault path
# secret/diytaxreturnuk/opsapi/prod/config). Add those two keys to that Vault
# path BEFORE deploying; without them setup-namespace falls back to its built-in
# defaults (admin@opsapi.com / Admin@123). setup-namespace is idempotent — once
# the admin exists it never rewrites the password, so redeploys are safe.
# namespaceSlug is not a secret, so it stays git-owned here.
setup:
  adminEmail: ""
  adminPassword: ""
  namespaceSlug: "workstation"

# Browser CORS allow-list (consumed by middleware/cors.lua) — git-owned here.
# workstation.academy lets the Academy tenant's instructor dashboard
# (teach.workstation.academy) call this shared API cross-origin;
# workstation.co.uk covers the opsapi admin UI. Additive; matches int.
corsAllowedDomains: "workstation.co.uk,workstation.academy"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# PROD runs ENTIRELY on cloud003 (the london edge node) — same segment as the
# dedicated workstation-db (devops/k8s/workstation-db-prod.yaml, also pinned to
# cloud003) and where diytaxreturn's own prod stack already lives. Co-locating
# app + DB on one node keeps prod off the down cloud<->LAN WireGuard mesh
# entirely (nothing it needs crosses segments). cloud003 carries the edge taint
# node-role.kubernetes.io/edge=true:NoSchedule, so the toleration below is
# REQUIRED or the pod sits Pending (untolerated taint).
nodeSelector:
  kubernetes.io/hostname: cloud003
tolerations:
  - key: node-role.kubernetes.io/edge
    operator: Exists
    effect: NoSchedule
